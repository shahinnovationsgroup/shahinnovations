<!doctype html>
<html lang="en">
  <head>
    <link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#020617" />
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/shahinnovations-favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShahInnovations</title>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("/sw.js")
        .then((registration) => {
          console.log(
            "ShahInnovations Service Worker registered:",
            registration.scope
          );
        })
        .catch((error) => {
          console.error(
            "ShahInnovations Service Worker registration failed:",
            error
          );
        });
    });
  }
</script>
  </body>
</html>
